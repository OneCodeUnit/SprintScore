name: Build and publish image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - run: dotnet test --configuration Release
      - run: node --test tests/client/*.test.cjs

  publish:
    needs: test
    # Не отменяем уже начатую запись тега; публикации ветки выполняются последовательно.
    concurrency:
      group: image-publish-${{ github.ref }}
      cancel-in-progress: false
    # В пулл-реквестах образ не публикуем — только прогоняем тесты.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=ref,event=tag

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote current master to latest
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          head_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping latest: master has advanced."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image@$IMAGE_DIGEST"
