name: Build and publish image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег опубликованного релиза для восстановления образа, например 1.1'
        required: true
        type: string
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  release-info:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          test "$(jq -r '.draft' <<< "$release")" = false
          tag=$(jq -r '.tag_name' <<< "$release")
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "stable=$(jq -r '.prerelease | not' <<< "$release")" >> "$GITHUB_OUTPUT"

  test:
    needs: release-info
    if: ${{ !cancelled() && (needs.release-info.result == 'success' || needs.release-info.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs.sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - run: dotnet test --configuration Release
      - run: node --test tests/client/*.test.cjs

  publish:
    needs: [test, release-info]
    # Сериализуем продвижение latest между разными релизами.
    concurrency:
      group: image-publish-releases
      cancel-in-progress: false
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.release-info.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ needs.release-info.outputs.sha }}
            type=raw,value=${{ needs.release-info.outputs.tag }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote latest stable release
        if: needs.release-info.outputs.stable == 'true'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
        run: |
          set -euo pipefail
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          if [ "$latest_tag" != "$RELEASE_TAG" ]; then
            echo "Skipping latest: another release is current."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image@$IMAGE_DIGEST"
